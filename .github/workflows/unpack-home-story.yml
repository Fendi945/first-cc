name: Unpack DAY1 home story assets

on:
  push:
    branches: [gh-pages]

permissions:
  contents: write

jobs:
  unpack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Extract uploaded DAY1 image pack
        shell: bash
        run: |
          set -e
          ZIP="assets/home-story/DAY1_home_story_web_ready.zip"
          if [ ! -f "$ZIP" ]; then
            echo "ZIP not found; nothing to do."
            exit 0
          fi
          TMP="$(mktemp -d)"
          unzip -o "$ZIP" -d "$TMP"
          for f in "$TMP"/*.webp; do
            [ -e "$f" ] || continue
            cp "$f" assets/home-story/
          done
          rm -f "$ZIP"
      - name: Commit extracted images
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/home-story
          git commit -m "Unpack DAY1 homepage high-resolution story images"
          git push origin gh-pages
