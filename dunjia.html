<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>遁甲 · 剪影投影</title>
<style>
*{margin:0;padding:0}
body{background:#050508;overflow:hidden;font-family:system-ui;color:#fff;height:100vh}
canvas{display:block;width:100vw;height:100vh}
#ui{position:fixed;top:12px;right:12px;display:flex;flex-direction:column;gap:6px;z-index:10;pointer-events:none}
#ui>*{pointer-events:auto}
#minfo{background:rgba(5,5,8,0.7);border:1px solid rgba(255,255,255,0.06);border-radius:10px;padding:10px 14px;backdrop-filter:blur(8px);min-width:140px}
.nm{font-size:18px;font-weight:bold}
.gr{font-size:11px;color:#999;line-height:1.6;margin-top:4px}
.gr span{display:inline-block;margin-right:10px}
.cb{height:4px;border-radius:2px;margin-top:6px;transition:.5s}
.btns{display:flex;gap:4px;flex-wrap:wrap}
.btns button{padding:4px 10px;border-radius:12px;border:1px solid rgba(255,255,255,0.12);background:rgba(5,5,8,0.6);color:#aaa;font-size:10px;cursor:pointer;transition:.2s;font-family:inherit;backdrop-filter:blur(4px)}
.btns button:hover{background:rgba(255,255,255,0.1);color:#fff}
.btns button.on{border-color:#fa0;color:#fa0}
.btns button.active{border-color:#4af;color:#4af}
#camStatus{position:fixed;bottom:12px;right:12px;font-size:9px;color:rgba(255,255,255,0.2);z-index:10;pointer-events:none}
#modename{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);font-size:11px;color:rgba(255,255,255,0.15);z-index:10;pointer-events:none;text-align:center;line-height:1.5}
@media(max-width:600px){
  #ui{top:8px;right:8px}#minfo{padding:8px 10px;min-width:auto}
  .nm{font-size:14px}.gr{font-size:10px}
  .btns button{font-size:9px;padding:3px 7px}
}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="ui">
<div id="minfo">
<div class="nm" id="nm">--</div>
<div class="gr"><span id="elTxt">-</span><span id="scTxt">-</span><span id="wpTxt">-</span></div>
<div class="cb" id="cbar"></div>
<div class="btns">
<button id="bReal" class="active">👤 实影</button>
<button id="bWave">🌊 波</button>
<button id="bParticle">✨ 粒</button>
<button id="bDuality">☯ 二</button>
</div>
<div class="btns">
<button id="b30">30x</button><button id="bP">⏸</button><button id="bR">↺</button><button id="bCam">📷</button>
</div>
</div>
</div>
<div id="modename">👤 实影模式 · 清晰剪影</div>
<div id="camStatus">📷 点按钮启动摄像头</div>

<script>
const SC = [
  {n:'子时',h:23,m:0,e:'水',c:'#1a2a6a',g:[26,42,106],st:'凝',pl:0.2,wp:0.15},
  {n:'丑时',h:1,m:0,e:'土',c:'#4a3428',g:[74,52,40],st:'伏',pl:0.3,wp:0.25},
  {n:'寅时',h:3,m:0,e:'木',c:'#1a4a2a',g:[26,74,42],st:'萌',pl:0.5,wp:0.35},
  {n:'卯时',h:5,m:0,e:'木',c:'#2a7a4a',g:[42,122,74],st:'舒',pl:0.7,wp:0.45},
  {n:'辰时',h:7,m:0,e:'土',c:'#6a7a2a',g:[106,122,42],st:'显',pl:0.9,wp:0.50},
  {n:'巳时',h:9,m:0,e:'火',c:'#a06a1a',g:[160,106,26],st:'炽',pl:1.3,wp:0.60},
  {n:'午时',h:11,m:0,e:'火',c:'#bb2a12',g:[187,42,18],st:'烈',pl:1.8,wp:0.80},
  {n:'未时',h:13,m:0,e:'土',c:'#b07a18',g:[176,122,24],st:'盈',pl:1.4,wp:0.65},
  {n:'申时',h:15,m:0,e:'金',c:'#3a7aa0',g:[58,122,160],st:'涌',pl:0.8,wp:0.40},
  {n:'酉时',h:17,m:0,e:'金',c:'#b08a3a',g:[176,138,58],st:'悠',pl:0.6,wp:0.35},
  {n:'戌时',h:19,m:0,e:'火',c:'#c83a1a',g:[200,58,26],st:'焕',pl:1.5,wp:0.70},
  {n:'亥时',h:21,m:0,e:'水',c:'#2a3a7a',g:[42,58,122],st:'息',pl:0.3,wp:0.20},
];

function getSC(tm){
  let tt=((tm%1440)+1440)%1440;
  for(let i=0;i<12;i++){
    let s=SC[i],n=SC[(i+1)%12],st=s.h*60+s.m,et=n.h*60+n.m;
    if(et<=st)et+=1440;let cm=tt;if(cm<st)cm+=1440;
    if(cm>=st&&cm<et)return{...s,pg:(cm-st)/(et-st),idx:i};
  }
  return{...SC[0],pg:0,idx:0};
}

let simTime=7*60+30,speed=1,paused=false,frame=0,displayMode='real';
let video=null,camActive=false,bgFrame=null,hasBg=false,silhouetteMask=null;
const cv=document.getElementById('cv'),cx=cv.getContext('2d');
let W,H;

function resize(){W=cv.width=window.innerWidth;H=cv.height=window.innerHeight}
window.onresize=resize;resize();

// ===== 摄像头 =====
async function startCamera(){
  document.getElementById('camStatus').textContent='⏳ 请求摄像头...';
  try{
    const stream=await navigator.mediaDevices.getUserMedia({video:{width:160,height:120,facingMode:'user'}});
    video=document.createElement('video');video.srcObject=stream;video.play();
    camActive=true;
    document.getElementById('camStatus').textContent='📷 请离开画面';
    document.getElementById('bCam').textContent='📷 拍背景';
    setTimeout(captureBg,500);
  }catch(e){
    document.getElementById('camStatus').textContent='❌ '+e.message;
  }
}
function captureBg(){
  if(!video||!camActive)return;
  document.getElementById('camStatus').textContent='📸 捕捉背景...';
  setTimeout(()=>{
    if(!video||!camActive)return;
    let tc=document.createElement('canvas');tc.width=160;tc.height=120;
    let tctx=tc.getContext('2d');tctx.drawImage(video,0,0,160,120);
    let id=tctx.getImageData(0,0,160,120);
    bgFrame=new Uint8Array(160*120);
    for(let i=0;i<160*120;i++){let idx=i*4;bgFrame[i]=(id.data[idx]*0.3+id.data[idx+1]*0.59+id.data[idx+2]*0.11);}
    hasBg=true;
    document.getElementById('camStatus').textContent='✅ 站到摄像头前';
    document.getElementById('bCam').textContent='📷 重拍';
  },600);
}
function processFrame(){
  if(!video||!camActive||!hasBg||!video.videoWidth)return null;
  let tc=document.createElement('canvas');tc.width=160;tc.height=120;
  let tctx=tc.getContext('2d');tctx.drawImage(video,0,0,160,120);
  let id=tctx.getImageData(0,0,160,120);
  let mask=new Uint8Array(160*120);let pc=0;
  for(let i=0;i<160*120;i++){let idx=i*4;if(Math.abs((id.data[idx]*0.3+id.data[idx+1]*0.59+id.data[idx+2]*0.11)-bgFrame[i])>25){mask[i]=255;pc++;}}
  if(pc/(160*120)<0.015){silhouetteMask=null;return null;}
  let cl=new Uint8Array(160*120);
  for(let y=1;y<119;y++)for(let x=1;x<159;x++){let c=0;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)if(mask[(y+dy)*160+(x+dx)])c++;if(c>=4)cl[y*160+x]=255;}
  silhouetteMask=cl;return cl;
}
function getPx(mask,s){let p=[];if(!mask)return p;s=s||2;for(let y=0;y<120;y+=s)for(let x=0;x<160;x+=s)if(mask[y*160+x])p.push({x,y});return p;}
function getEd(mask){let e=[];if(!mask)return e;for(let y=1;y<119;y++)for(let x=1;x<159;x++){if(!mask[y*160+x])continue;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!mask[(y+dy)*160+(x+dx)]){e.push({x,y});dy=2;break;}}}return e;}

// ===== 粒子 =====
const MP=1200;let pts=[];
for(let i=0;i<MP;i++)pts.push({x:0,y:0,vx:0,vy:0,sz:1,life:0,act:false});

// ===== 绘制 =====
function draw(){
  cx.fillStyle='#050508';cx.fillRect(0,0,W,H);
  const sc=getSC(simTime);let [r,g,b]=sc.g;
  let pulse=0.6+0.4*Math.sin(frame*0.04*sc.pl);

  // 摄像头
  let mask=null;
  if(camActive&&hasBg)mask=processFrame();

  // === 雾墙渐变 ===
  let fg=cx.createLinearGradient(0,0,0,H);
  fg.addColorStop(0,'rgba(10,10,20,0.15)');
  fg.addColorStop(0.15,`rgba(${r},${g},${b},0.03)`);
  fg.addColorStop(0.5,`rgba(${r},${g},${b},0.05)`);
  fg.addColorStop(0.85,`rgba(${r},${g},${b},0.03)`);
  fg.addColorStop(1,'rgba(10,10,20,0.15)');
  cx.fillStyle=fg;cx.fillRect(0,0,W,H);

  // === 剪影 ===
  let pixels=mask?getPx(mask,1):[];
  let cx2=W/2,cy2=H*0.55;

  if(pixels.length>50){
    // 质心
    let cxp=0,cyp=0;
    for(let p of pixels){cxp+=p.x;cyp+=p.y;}
    cxp/=pixels.length;cyp/=pixels.length;

    let sca=Math.min(W,H)*0.0042;

    // === 基础辉光（所有模式共享）===
    let gr=cx.createRadialGradient(cx2,cy2,0,cx2,cy2,Math.min(W,H)*0.3);
    gr.addColorStop(0,`rgba(${r},${g},${b},0.15)`);
    gr.addColorStop(0.5,`rgba(${r},${g},${b},0.05)`);
    gr.addColorStop(1,`rgba(${r},${g},${b},0)`);
    cx.fillStyle=gr;cx.beginPath();cx.arc(cx2,cy2,Math.min(W,H)*0.3,0,Math.PI*2);cx.fill();

    // === 实影模式（清晰剪影——默认）===
    if(displayMode==='real'){
      // 主体——用较大像素块填充，提高透明度
      let stp=2; // 采样步长2，较密
      cx.fillStyle=`rgba(${r},${g},${b},0.35)`;
      for(let i=0;i<pixels.length;i+=stp){
        let p=pixels[i];
        let px=cx2+(p.x-cxp)*sca;let py=cy2+(p.y-cyp)*sca;
        cx.fillRect(px-1.5,py-1.5,4,4);
      }
      // 边缘——亮线勾勒
      let edges=getEd(silhouetteMask);
      cx.fillStyle=`rgba(${Math.min(255,r+100)},${Math.min(255,g+100)},${Math.min(255,b+100)},0.45)`;
      for(let i=0;i<edges.length;i+=stp){
        let p=edges[i];
        let px=cx2+(p.x-cxp)*sca;let py=cy2+(p.y-cyp)*sca;
        cx.fillRect(px-0.8,py-0.8,2,2);
      }
    }

    // === 波模式 ===
    if(displayMode==='wave'){
      let ph=frame*0.025;
      let stp=Math.max(1,Math.floor(pixels.length/400));
      for(let i=0;i<pixels.length;i+=stp){
        let p=pixels[i];
        let px=cx2+(p.x-cxp)*sca;let py=cy2+(p.y-cyp)*sca;
        let w1=Math.sin(p.x*0.1+ph)*0.5+0.5;
        let w2=Math.cos(p.y*0.12+ph*0.7)*0.5+0.5;
        let w3=Math.sin((p.x+p.y)*0.07+ph*1.3)*0.5+0.5;
        let wv=w1*0.4+w2*0.35+w3*0.25;
        cx.fillStyle=`rgba(${r},${g},${b},${(0.2+0.4*wv)*pulse})`;
        cx.fillRect(px-1.5,py-1.5,4,4);
      }
      // 清晰边缘+波位移
      let edges=getEd(silhouetteMask);
      for(let i=0;i<edges.length;i+=stp){
        let p=edges[i];
        let px=cx2+(p.x-cxp)*sca;let py=cy2+(p.y-cyp)*sca;
        let wob=Math.sin(p.x*0.12+p.y*0.1+ph*1.5)*8;
        cx.fillStyle=`rgba(${Math.min(255,r+80)},${Math.min(255,g+80)},${Math.min(255,b+80)},0.35)`;
        cx.fillRect(px+wob-0.8,py-0.8,2,2);
      }
    }

    // === 粒子模式 ===
    if(displayMode==='particle'){
      let cnt=Math.min(pixels.length,Math.floor(500+sc.wp*700));
      let stp=Math.max(1,Math.floor(pixels.length/cnt));
      for(let i=0;i<pixels.length;i+=stp){
        let p=pixels[i];
        let px=cx2+(p.x-cxp)*sca;let py=cy2+(p.y-cyp)*sca;
        let sz=1.5+Math.random()*2.5;
        cx.fillStyle=`rgba(${r},${g},${b},${0.25+Math.random()*0.3})`;
        cx.beginPath();cx.arc(px,py,sz,0,Math.PI*2);cx.fill();
      }
      // 边缘依然清晰
      let edges=getEd(silhouetteMask);
      cx.fillStyle=`rgba(${Math.min(255,r+80)},${Math.min(255,g+80)},${Math.min(255,b+80)},0.3)`;
      for(let i=0;i<edges.length;i+=stp){
        let p=edges[i];
        let px=cx2+(p.x-cxp)*sca;let py=cy2+(p.y-cyp)*sca;
        cx.fillRect(px-0.5,py-0.5,2,2);
      }
    }

    // === 二象性模式 ===
    if(displayMode==='duality'){
      let ph=frame*0.025;
      let stp=Math.max(1,Math.floor(pixels.length/200));
      // 粒子背景
      for(let i=0;i<pixels.length;i+=stp){
        let p=pixels[i];
        let px=cx2+(p.x-cxp)*sca;let py=cy2+(p.y-cyp)*sca;
        let sz=1+Math.random()*2;
        cx.fillStyle=`rgba(${r},${g},${b},${0.2+Math.random()*0.2})`;
        cx.beginPath();cx.arc(px,py,sz,0,Math.PI*2);cx.fill();
      }
      // 波覆盖
      for(let i=0;i<pixels.length;i+=stp*2){
        let p=pixels[i];
        let px=cx2+(p.x-cxp)*sca;let py=cy2+(p.y-cyp)*sca;
        let wv=Math.sin(p.x*0.08+ph)*0.5+0.5;
        cx.fillStyle=`rgba(${Math.min(255,r+50)},${Math.min(255,g+50)},${Math.min(255,b+50)},${0.15*wv})`;
        cx.fillRect(px-1,py-1,3,3);
      }
      // 边缘
      let edges=getEd(silhouetteMask);
      cx.fillStyle=`rgba(${Math.min(255,r+80)},${Math.min(255,g+80)},${Math.min(255,b+80)},0.35)`;
      for(let i=0;i<edges.length;i+=stp){
        let p=edges[i];
        let px=cx2+(p.x-cxp)*sca;let py=cy2+(p.y-cyp)*sca;
        cx.fillRect(px-0.5,py-0.5,2,2);
      }
    }

    // === 地面阴影（所有模式）===
    cx.fillStyle=`rgba(${r},${g},${b},${0.04*pulse})`;
    cx.beginPath();cx.ellipse(cx2,cy2+Math.min(W,H)*0.22,Math.min(W,H)*0.15*pulse,Math.min(W,H)*0.025*pulse,0,0,Math.PI*2);
    cx.fill();

    // === 标签 ===
    cx.fillStyle=`rgba(${r},${g},${b},0.12)`;
    cx.font='13px system-ui';cx.textAlign='center';
    cx.fillText('那是谁？',cx2,cy2-Math.min(W,H)*0.22);

    document.getElementById('camStatus').textContent='📷 '+pixels.length+'px';
  } else {
    // === 无摄像头占位 ===
    let sz=Math.min(W,H)*0.1;
    let sw=Math.sin(frame*0.04)*sz*0.08;

    // 辉光
    let gr=cx.createRadialGradient(cx2,cy2,0,cx2,cy2,sz);
    gr.addColorStop(0,`rgba(${r},${g},${b},0.08)`);
    gr.addColorStop(1,`rgba(${r},${g},${b},0)`);
    cx.fillStyle=gr;cx.beginPath();cx.arc(cx2,cy2,sz,0,Math.PI*2);cx.fill();

    // 实心人形
    cx.fillStyle=`rgba(${r},${g},${b},0.3)`;
    cx.strokeStyle=`rgba(${Math.min(255,r+80)},${Math.min(255,g+80)},${Math.min(255,b+80)},0.35)`;
    cx.lineWidth=1.5;
    cx.beginPath();cx.arc(cx2,cy2-sz*0.38,sz*0.25,0,Math.PI*2);cx.fill();cx.stroke();
    cx.beginPath();
    cx.moveTo(cx2-sz*0.2,cy2-sz*0.1);cx.lineTo(cx2-sz*0.15+sw,cy2+sz*0.2);
    cx.lineTo(cx2+sz*0.15+sw,cy2+sz*0.2);cx.lineTo(cx2+sz*0.2,cy2-sz*0.1);
    cx.closePath();cx.fill();cx.stroke();
    let ls=Math.sin(frame*0.06)*sz*0.08;
    cx.beginPath();cx.moveTo(cx2-sz*0.08+sw*0.5,cy2+sz*0.2);cx.lineTo(cx2-sz*0.08-ls,cy2+sz*0.42);cx.stroke();
    cx.beginPath();cx.moveTo(cx2+sz*0.08+sw*0.5,cy2+sz*0.2);cx.lineTo(cx2+sz*0.08+ls,cy2+sz*0.42);cx.stroke();

    // 地面阴影
    cx.fillStyle=`rgba(${r},${g},${b},${0.03*pulse})`;
    cx.beginPath();cx.ellipse(cx2,cy2+sz*0.5,sz*0.35*pulse,sz*0.06*pulse,0,0,Math.PI*2);cx.fill();

    cx.fillStyle=`rgba(${r},${g},${b},0.1)`;
    cx.font='13px system-ui';cx.textAlign='center';
    cx.fillText('那是谁？',cx2,cy2-sz*0.55);

    if(!camActive)document.getElementById('camStatus').textContent='📷 点按钮启动摄像头';
    else if(!hasBg)document.getElementById('camStatus').textContent='⏳ 背景捕捉中...';
    else document.getElementById('camStatus').textContent='👤 站到摄像头前';
  }

  // === 面板 ===
  let em='';let si=sc.idx;
  if(si===0||si===11)em='🌙';else if(si>=2&&si<=7)em='☀️';else em='🌓';
  document.getElementById('nm').textContent=sc.n+' '+em;
  document.getElementById('elTxt').textContent=sc.e;
  document.getElementById('scTxt').textContent=sc.st;
  document.getElementById('wpTxt').textContent='波'+((1-sc.wp)*100).toFixed(0)+'% 粒'+(sc.wp*100).toFixed(0)+'%';
  document.getElementById('cbar').style.background=sc.c;
  let mn='👤 实影 · 清晰剪影';
  if(displayMode==='wave')mn='🌊 波 · 驻波涟漪';
  else if(displayMode==='particle')mn='✨ 粒 · 光子群';
  else if(displayMode==='duality')mn='☯ 二象性 · 波粒同现';
  document.getElementById('modename').textContent=mn+' · '+sc.n+' · '+sc.e;

  requestAnimationFrame(draw);
}

// ===== 控件 =====
document.getElementById('b30').onclick=function(){
  speed=speed===1?30:1;this.textContent=speed===30?'30x':'30x';
  this.classList.toggle('on',speed===30);
};
document.getElementById('bP').onclick=function(){
  paused=!paused;this.textContent=paused?'▶':'⏸';
  this.classList.toggle('on',paused);
};
document.getElementById('bR').onclick=function(){
  simTime=7*60+30;speed=1;paused=false;frame=0;
  document.getElementById('b30').textContent='30x';document.getElementById('b30').classList.remove('on');
  document.getElementById('bP').textContent='⏸';document.getElementById('bP').classList.remove('on');
};
document.getElementById('bCam').onclick=function(){
  if(!camActive)startCamera();else captureBg();
};
function setMode(mode){
  displayMode=mode;
  document.querySelectorAll('#bReal,#bWave,#bParticle,#bDuality').forEach(b=>b.classList.remove('active'));
  if(mode==='real')document.getElementById('bReal').classList.add('active');
  else if(mode==='wave')document.getElementById('bWave').classList.add('active');
  else if(mode==='particle')document.getElementById('bParticle').classList.add('active');
  else document.getElementById('bDuality').classList.add('active');
}
document.getElementById('bReal').onclick=()=>setMode('real');
document.getElementById('bWave').onclick=()=>setMode('wave');
document.getElementById('bParticle').onclick=()=>setMode('particle');
document.getElementById('bDuality').onclick=()=>setMode('duality');

function update(){
  if(!paused){simTime+=0.016*speed/60*1440;frame+=0.016*speed;}
  requestAnimationFrame(update);
}
requestAnimationFrame(update);requestAnimationFrame(draw);
</script>
</body>
</html>
