<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>大一造园后台｜订单工作台</title>
<style>
:root{--bg:#f6f3ef;--paper:#fff;--text:#222;--muted:#77716b;--line:#e5ded7;--accent:#c6402f;--soft:#f3eee8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif}button,input,textarea{font:inherit}.wrap{max-width:1240px;margin:auto;padding:26px 18px 70px}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:9px;font-weight:700}.latin{font:700 28px Georgia,serif}.dot{width:9px;height:9px;border-radius:50%;background:var(--accent)}.sub{font-size:12px;color:var(--muted)}.notice{background:#fff8f6;border:1px solid #ecd2cd;color:#6e352d;border-radius:14px;padding:12px 14px;line-height:1.6;margin-bottom:18px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.stat{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:17px}.stat small{display:block;color:var(--muted);margin-bottom:6px}.stat strong{font-size:26px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tab,.btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 14px;cursor:pointer;font-weight:650}.tab.on{background:#222;color:#fff;border-color:#222}.btn.primary{background:#222;color:white;border-color:#222}.layout{display:grid;grid-template-columns:420px 1fr;gap:16px}.list,.detail{background:#fff;border:1px solid var(--line);border-radius:20px;min-height:620px;overflow:hidden}.listHead,.detailHead{padding:18px 20px;border-bottom:1px solid var(--line)}.orders{max-height:700px;overflow:auto}.order{padding:16px 20px;border-bottom:1px solid var(--line);cursor:pointer}.order:hover,.order.on{background:#faf7f3}.orderTop{display:flex;justify-content:space-between;gap:12px}.orderId{font-weight:750}.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.chip{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:5px 8px;background:#fff}.chip.pay{color:#8b4e16;background:#fff8ec}.chip.ok{color:#2f6b3f;background:#eff8f1}.chip.work{color:#6a4d9b;background:#f4effb}.detailBody{padding:20px}.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}.photo{border-radius:16px;overflow:hidden;background:#eee;min-height:300px}.photo img{width:100%;height:100%;object-fit:cover}.facts{display:grid;grid-template-columns:1fr 1fr;gap:9px}.fact{background:var(--soft);border:1px solid var(--line);border-radius:13px;padding:13px}.fact small{display:block;color:var(--muted);margin-bottom:5px}.tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.tag{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:6px 9px}.section{margin-top:20px}.section h3{margin:0 0 10px}.prompt{width:100%;min-height:210px;border:1px solid var(--line);border-radius:14px;padding:14px;line-height:1.6;background:#fcfbf9}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}.slots{display:grid;grid-template-columns:1fr 1fr;gap:12px}.slot{min-height:180px;border:1.5px dashed #bbb2aa;border-radius:14px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;background:#faf8f5}.slot input{display:none}.slot label{cursor:pointer;color:var(--muted);padding:20px;text-align:center}.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.empty{padding:40px;color:var(--muted);text-align:center}.small{font-size:12px;color:var(--muted)}@media(max-width:900px){.stats{grid-template-columns:1fr 1fr}.layout{grid-template-columns:1fr}.hero{grid-template-columns:1fr}.list{min-height:0}.orders{max-height:360px}} 
</style>
</head>
<body>
<div class="wrap">
<div class="top"><div class="brand"><span class="latin">dayi</span><span class="dot"></span><span>大一造园后台</span></div><div class="sub">订单工作台 · Prototype</div></div>
<div class="notice">这是第一版后台原型。现在它能读取你在<strong>同一台设备、同一浏览器</strong>里测试产生的订单；真实客户从其他设备提交后要自动出现在这里，还需要下一步接数据库和登录权限。</div>
<div class="stats"><div class="stat"><small>全部订单</small><strong id="stAll">0</strong></div><div class="stat"><small>待核验付款</small><strong id="stPay">0</strong></div><div class="stat"><small>待生图</small><strong id="stGen">0</strong></div><div class="stat"><small>已完成</small><strong id="stDone">0</strong></div></div>
<div class="toolbar"><div class="tabs"><button class="tab on" data-f="all">全部</button><button class="tab" data-f="pay">待核验</button><button class="tab" data-f="gen">待生图</button><button class="tab" data-f="done">已完成</button></div><div><button class="btn" onclick="render()">刷新订单</button></div></div>
<div class="layout">
  <div class="list"><div class="listHead"><strong>订单列表</strong><div class="small">点击订单查看详情</div></div><div class="orders" id="orders"></div></div>
  <div class="detail"><div class="detailHead"><strong>订单详情</strong></div><div class="detailBody" id="detail"><div class="empty">还没有选择订单。</div></div></div>
</div>
</div>
<script>
const KEY="dayiGardenOrders";let filter="all";let selected=null;
function getOrders(){try{return JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){return[]}}
function saveOrders(a){localStorage.setItem(KEY,JSON.stringify(a))}
function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function counts(a){stAll.textContent=a.length;stPay.textContent=a.filter(x=>x.paymentStatus==="待核验").length;stGen.textContent=a.filter(x=>x.processStatus==="待生图").length;stDone.textContent=a.filter(x=>x.processStatus==="已完成").length}
function match(o){if(filter==="pay")return o.paymentStatus==="待核验";if(filter==="gen")return o.processStatus==="待生图";if(filter==="done")return o.processStatus==="已完成";return true}
function render(){const a=getOrders();counts(a);const show=a.filter(match);orders.innerHTML=show.length?show.map(o=>'<div class="order '+(selected===o.order?'on':'')+'" onclick="openOrder(\''+o.order+'\')"><div class="orderTop"><span class="orderId">'+esc(o.order)+'</span><span class="small">'+new Date(o.createdAt).toLocaleString()+'</span></div><div class="small" style="margin-top:5px">'+esc(o.style)+' · '+esc(o.size)+' · '+esc(o.owner)+'</div><div class="chips"><span class="chip '+(o.paymentStatus==="已确认"?'ok':'pay')+'">'+esc(o.paymentStatus)+'</span><span class="chip work">'+esc(o.processStatus||"等待付款核验")+'</span></div></div>').join(""):'<div class="empty">当前没有订单。</div>';if(selected){const o=a.find(x=>x.order===selected);if(o)drawDetail(o)}}
function openOrder(id){selected=id;render()}
function drawDetail(o){detail.innerHTML='<div class="hero"><div class="photo">'+(o.photo?'<img src="'+o.photo+'">':'<div class="empty">无照片</div>')+'</div><div><div class="facts"><div class="fact"><small>订单号</small><strong>'+esc(o.order)+'</strong></div><div class="fact"><small>风格</small><strong>'+esc(o.style)+'</strong></div><div class="fact"><small>主人</small><strong>'+esc(o.owner)+'</strong></div><div class="fact"><small>尺度</small><strong>'+esc(o.size)+'</strong></div><div class="fact"><small>维护投入</small><strong>'+esc(o.effort)+'</strong></div><div class="fact"><small>付款</small><strong>'+esc(o.paymentStatus)+'</strong></div></div><div class="tags">'+(o.tags||[]).map(t=>'<span class="tag">'+esc(t)+'</span>').join("")+'</div><div class="actions"><button class="btn primary" onclick="confirmPay(\''+o.order+'\')">确认到账</button><button class="btn" onclick="markGen(\''+o.order+'\')">标记待生图</button></div></div></div><div class="section"><h3>生图任务</h3><textarea class="prompt" id="p">'+esc(o.prompt)+'</textarea><div class="actions"><button class="btn" onclick="copyPrompt()">复制提示词</button></div></div><div class="section"><h3>效果图回填</h3><div class="slots"><div class="slot" id="slotA"><label>上传方向 A<input type="file" accept="image/*" onchange="loadResult(event,\''+o.order+'\',\'resultA\',\'slotA\')"></label>'+(o.resultA?'<img src="'+o.resultA+'">':'')+'</div><div class="slot" id="slotB"><label>上传方向 B<input type="file" accept="image/*" onchange="loadResult(event,\''+o.order+'\',\'resultB\',\'slotB\')"></label>'+(o.resultB?'<img src="'+o.resultB+'">':'')+'</div></div><div class="actions"><button class="btn primary" onclick="finishOrder(\''+o.order+'\')">标记完成</button></div><div class="small" style="margin-top:8px">结果页发布链接会在下一版接入真实数据库后生成。</div></div>'}
function mutate(id,fn){const a=getOrders();const i=a.findIndex(x=>x.order===id);if(i<0)return;fn(a[i]);try{saveOrders(a)}catch(e){alert("浏览器本地存储空间不足，图片可能无法保存。")}render()}
function confirmPay(id){mutate(id,o=>{o.paymentStatus="已确认";if(o.processStatus==="等待付款核验"||!o.processStatus)o.processStatus="待生图"})}
function markGen(id){mutate(id,o=>o.processStatus="待生图")}
function finishOrder(id){mutate(id,o=>o.processStatus="已完成")}
function copyPrompt(){const t=document.getElementById("p");navigator.clipboard.writeText(t.value).then(()=>alert("提示词已复制"))}
function loadResult(e,id,key,slotId){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>mutate(id,o=>o[key]=r.result);r.readAsDataURL(f)}
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));t.classList.add("on");filter=t.dataset.f;render()});render();
</script>
</body></html>
