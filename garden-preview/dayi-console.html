<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>大一造园后台｜订单工作台</title>
<style>
:root{--bg:#f6f3ef;--paper:#fff;--text:#222;--muted:#77716b;--line:#e5ded7;--accent:#c6402f;--soft:#f3eee8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif}
button,input,textarea{font:inherit}.wrap{max-width:1240px;margin:auto;padding:26px 18px 70px}
.top{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:9px;font-weight:700}.latin{font:700 28px Georgia,serif}.dot{width:9px;height:9px;border-radius:50%;background:var(--accent)}.sub{font-size:12px;color:var(--muted)}
.notice{background:#fff8f6;border:1px solid #ecd2cd;color:#6e352d;border-radius:14px;padding:12px 14px;line-height:1.6;margin-bottom:18px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.stat{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:17px}.stat small{display:block;color:var(--muted);margin-bottom:6px}.stat strong{font-size:26px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab,.btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 14px;cursor:pointer;font-weight:650}.tab.on{background:#222;color:#fff;border-color:#222}.btn.primary{background:#222;color:white;border-color:#222}.btn:disabled{opacity:.5;cursor:not-allowed}
.layout{display:grid;grid-template-columns:420px 1fr;gap:16px}.list,.detail{background:#fff;border:1px solid var(--line);border-radius:20px;min-height:620px;overflow:hidden}.listHead,.detailHead{padding:18px 20px;border-bottom:1px solid var(--line)}.orders{max-height:700px;overflow:auto}
.order{padding:16px 20px;border-bottom:1px solid var(--line);cursor:pointer}.order:hover,.order.on{background:#faf7f3}.orderTop{display:flex;justify-content:space-between;gap:12px}.orderId{font-weight:750}.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.chip{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:5px 8px;background:#fff}.chip.pay{color:#8b4e16;background:#fff8ec}.chip.ok{color:#2f6b3f;background:#eff8f1}.chip.work{color:#6a4d9b;background:#f4effb}
.detailBody{padding:20px}.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}.photo{border-radius:16px;overflow:hidden;background:#eee;min-height:300px;display:flex;align-items:center;justify-content:center}.photo img{width:100%;height:100%;object-fit:cover}.facts{display:grid;grid-template-columns:1fr 1fr;gap:9px}.fact{background:var(--soft);border:1px solid var(--line);border-radius:13px;padding:13px}.fact small{display:block;color:var(--muted);margin-bottom:5px}.tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.tag{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:6px 9px}
.section{margin-top:20px}.section h3{margin:0 0 10px}.prompt{width:100%;min-height:210px;border:1px solid var(--line);border-radius:14px;padding:14px;line-height:1.6;background:#fcfbf9}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}.slots{display:grid;grid-template-columns:1fr 1fr;gap:12px}.slot{min-height:190px;border:1.5px dashed #bbb2aa;border-radius:14px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;background:#faf8f5}.slot input{display:none}.slot label{cursor:pointer;color:var(--muted);padding:20px;text-align:center}.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.empty{padding:40px;color:var(--muted);text-align:center}.small{font-size:12px;color:var(--muted)}.hidden{display:none!important}
.loginWrap{max-width:520px;margin:70px auto}.loginCard{background:#fff;border:1px solid var(--line);border-radius:24px;padding:30px;box-shadow:0 18px 44px rgba(30,24,20,.06)}.loginCard h1{font-size:34px;margin:6px 0 10px}.loginCard p{color:var(--muted);line-height:1.7}.field{display:flex;flex-direction:column;gap:7px;margin-top:14px}.field label{font-size:13px;color:var(--muted)}.field input{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff}.loginActions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.statusText{font-size:13px;color:var(--muted);margin-top:12px;line-height:1.6}
@media(max-width:900px){.stats{grid-template-columns:1fr 1fr}.layout{grid-template-columns:1fr}.hero{grid-template-columns:1fr}.list{min-height:0}.orders{max-height:360px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand"><span class="latin">dayi</span><span class="dot"></span><span>大一造园后台</span></div>
    <div class="sub" id="sessionLabel">云端订单工作台</div>
  </div>

  <div id="loginView" class="loginWrap">
    <div class="loginCard">
      <div class="small">DAYI GARDEN CONSOLE</div>
      <h1>后台登录</h1>
      <p>第一次使用请先开通后台账号；以后直接登录即可。订单与客户照片均从 Supabase 云端读取。</p>
      <div class="field"><label>邮箱</label><input id="loginEmail" type="email" autocomplete="email" placeholder="你的后台邮箱"></div>
      <div class="field"><label>密码</label><input id="loginPassword" type="password" autocomplete="current-password" placeholder="至少 8 位"></div>
      <div class="loginActions">
        <button class="btn primary" onclick="signIn()">登录后台</button>
        <button class="btn" onclick="signUp()">首次开通</button>
      </div>
      <div class="statusText" id="loginStatus">只有授权邮箱可以读取和修改订单。</div>
    </div>
  </div>

  <div id="appView" class="hidden">
    <div class="notice"><strong>云端后台已接通。</strong> 客户从任意手机或电脑提交后，订单会进入这里。处理顺序：核验付款 → 生图 → 回填两张效果图 → 标记完成。</div>
    <div class="stats">
      <div class="stat"><small>全部订单</small><strong id="stAll">0</strong></div>
      <div class="stat"><small>待核验付款</small><strong id="stPay">0</strong></div>
      <div class="stat"><small>待生图</small><strong id="stGen">0</strong></div>
      <div class="stat"><small>已完成</small><strong id="stDone">0</strong></div>
    </div>
    <div class="toolbar">
      <div class="tabs">
        <button class="tab on" data-f="all">全部</button>
        <button class="tab" data-f="pay">① 待核验</button>
        <button class="tab" data-f="gen">② 待生图</button>
        <button class="tab" data-f="done">③ 已完成</button>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn" onclick="loadOrders()">刷新订单</button>
        <button class="btn" onclick="signOut()">退出登录</button>
      </div>
    </div>
    <div class="layout">
      <div class="list">
        <div class="listHead"><strong>订单列表</strong><div class="small">真实客户提交后会出现在这里</div></div>
        <div class="orders" id="orders"></div>
      </div>
      <div class="detail">
        <div class="detailHead"><strong>订单详情 / 处理工作区</strong></div>
        <div class="detailBody" id="detail"><div class="empty">还没有选择订单。</div></div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://fhvhnibznphatfnbvvnb.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_8_ElUXtWKbEM9Of37zdYug_mdWjcV4B";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);

let allOrders=[], filter="all", selected=null;

function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function payLabel(v){return v==="confirmed"?"已确认":"待核验"}
function processLabel(v){return v==="pending_generation"?"待生图":v==="completed"?"已完成":"等待付款核验"}
function match(o){if(filter==="pay")return o.payment_status!=="confirmed";if(filter==="gen")return o.process_status==="pending_generation";if(filter==="done")return o.process_status==="completed";return true}
function counts(a){stAll.textContent=a.length;stPay.textContent=a.filter(x=>x.payment_status!=="confirmed").length;stGen.textContent=a.filter(x=>x.process_status==="pending_generation").length;stDone.textContent=a.filter(x=>x.process_status==="completed").length}

async function init(){
  const {data:{session}}=await sb.auth.getSession();
  setSession(session);
  sb.auth.onAuthStateChange((_event,session)=>setSession(session));
}
function setSession(session){
  if(session){
    loginView.classList.add("hidden");appView.classList.remove("hidden");
    sessionLabel.textContent=(session.user.email||"已登录")+" · 云端订单工作台";
    loadOrders();
  }else{
    appView.classList.add("hidden");loginView.classList.remove("hidden");
    sessionLabel.textContent="云端订单工作台";
  }
}
async function signUp(){
  const email=loginEmail.value.trim(), password=loginPassword.value;
  if(!email||password.length<8){loginStatus.textContent="请填写邮箱，并设置至少 8 位密码。";return}
  loginStatus.textContent="正在开通…";
  const {data,error}=await sb.auth.signUp({email,password});
  if(error){loginStatus.textContent="开通失败："+error.message;return}
  if(data.session){loginStatus.textContent="开通成功，已登录。"}
  else loginStatus.textContent="开通请求已发送。请到邮箱完成确认，然后回来登录。";
}
async function signIn(){
  const email=loginEmail.value.trim(), password=loginPassword.value;
  if(!email||!password){loginStatus.textContent="请输入邮箱和密码。";return}
  loginStatus.textContent="正在登录…";
  const {error}=await sb.auth.signInWithPassword({email,password});
  if(error){loginStatus.textContent="登录失败："+error.message;return}
  loginStatus.textContent="登录成功。";
}
async function signOut(){await sb.auth.signOut();allOrders=[];selected=null}

async function loadOrders(){
  orders.innerHTML='<div class="empty">正在读取云端订单…</div>';
  const {data,error}=await sb.from("orders").select("*").order("created_at",{ascending:false});
  if(error){orders.innerHTML='<div class="empty">读取失败：'+esc(error.message)+'</div>';return}
  allOrders=data||[];counts(allOrders);renderList();
  if(selected){
    const o=allOrders.find(x=>x.id===selected);
    if(o)drawDetail(o);else{selected=null;detail.innerHTML='<div class="empty">还没有选择订单。</div>'}
  }
}
function renderList(){
  const show=allOrders.filter(match);
  orders.innerHTML=show.length?show.map(o=>{
    const pay=o.payment_status==="confirmed";
    return '<div class="order '+(selected===o.id?'on':'')+'" onclick="openOrder(\''+o.id+'\')">'+
      '<div class="orderTop"><span class="orderId">'+esc(o.order_code||o.id.slice(0,8))+'</span><span class="small">'+new Date(o.created_at).toLocaleString()+'</span></div>'+
      '<div class="small" style="margin-top:5px">'+esc(o.style)+' · '+esc(o.yard_size)+' · '+esc(o.owner_type)+'</div>'+
      '<div class="chips"><span class="chip '+(pay?'ok':'pay')+'">'+payLabel(o.payment_status)+'</span><span class="chip work">'+processLabel(o.process_status)+'</span></div>'+
      '</div>';
  }).join(""):'<div class="empty">当前没有订单。</div>';
}
async function openOrder(id){selected=id;renderList();const o=allOrders.find(x=>x.id===id);if(o)await drawDetail(o)}

async function signedUrl(bucket,path){
  if(!path)return null;
  const {data,error}=await sb.storage.from(bucket).createSignedUrl(path,3600);
  if(error)return null;
  return data.signedUrl;
}
async function drawDetail(o){
  detail.innerHTML='<div class="empty">正在加载订单详情…</div>';
  const [photoUrl,aUrl,bUrl]=await Promise.all([
    signedUrl("order-photos",o.photo_path),
    signedUrl("order-results",o.result_a_path),
    signedUrl("order-results",o.result_b_path)
  ]);
  detail.innerHTML=
    '<div class="hero">'+
      '<div class="photo">'+(photoUrl?'<img src="'+photoUrl+'" alt="客户院子原图">':'<div class="empty">原图暂不可读取</div>')+'</div>'+
      '<div>'+
        '<div class="facts">'+
          '<div class="fact"><small>订单号</small><strong>'+esc(o.order_code||"—")+'</strong></div>'+
          '<div class="fact"><small>风格</small><strong>'+esc(o.style||"—")+'</strong></div>'+
          '<div class="fact"><small>主人</small><strong>'+esc(o.owner_type||"—")+'</strong></div>'+
          '<div class="fact"><small>尺度</small><strong>'+esc(o.yard_size||"—")+'</strong></div>'+
          '<div class="fact"><small>维护投入</small><strong>'+esc(o.maintenance_level||"—")+'</strong></div>'+
          '<div class="fact"><small>付款</small><strong>'+payLabel(o.payment_status)+'</strong></div>'+
        '</div>'+
        '<div class="tags">'+(o.needs||[]).map(t=>'<span class="tag">'+esc(t)+'</span>').join("")+'</div>'+
        '<div class="actions">'+
          (o.payment_status!=="confirmed"?'<button class="btn primary" onclick="confirmPay(\''+o.id+'\')">确认到账并进入待生图</button>':'<span class="chip ok">款项已确认</span>')+
        '</div>'+
      '</div>'+
    '</div>'+
    '<div class="section"><h3>生图任务</h3><textarea class="prompt" id="p">'+esc(o.prompt||"")+'</textarea><div class="actions"><button class="btn" onclick="copyPrompt()">复制提示词</button></div></div>'+
    '<div class="section"><h3>效果图回填</h3><div class="slots">'+
      '<div class="slot" id="slotA">'+(aUrl?'<img src="'+aUrl+'">':'<label>上传方向 A<input type="file" accept="image/*" onchange="uploadResult(event,\''+o.id+'\',\'A\')"></label>')+'</div>'+
      '<div class="slot" id="slotB">'+(bUrl?'<img src="'+bUrl+'">':'<label>上传方向 B<input type="file" accept="image/*" onchange="uploadResult(event,\''+o.id+'\',\'B\')"></label>')+'</div>'+
    '</div><div class="actions"><button class="btn primary" onclick="finishOrder(\''+o.id+'\')">标记完成</button></div>'+
    '<div class="small" style="margin-top:8px">两张效果图回填后，再标记完成。客户专属结果页会在下一步接上。</div></div>';
}
async function confirmPay(id){
  const {error}=await sb.from("orders").update({
    payment_status:"confirmed",
    process_status:"pending_generation",
    status:"paid",
    updated_at:new Date().toISOString()
  }).eq("id",id);
  if(error){alert("更新失败："+error.message);return}
  await loadOrders();selected=id;await openOrder(id);
}
async function uploadResult(e,id,side){
  const file=e.target.files[0];if(!file)return;
  const o=allOrders.find(x=>x.id===id);if(!o)return;
  const ext=(file.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"")||"jpg";
  const path="results/"+(o.order_code||id)+"/"+side+"-"+Date.now()+"."+ext;
  const {data,error}=await sb.storage.from("order-results").upload(path,file,{upsert:false,contentType:file.type||"image/jpeg"});
  if(error){alert("上传失败："+error.message);return}
  const field=side==="A"?"result_a_path":"result_b_path";
  const upd=await sb.from("orders").update({[field]:data.path,updated_at:new Date().toISOString()}).eq("id",id);
  if(upd.error){alert("保存失败："+upd.error.message);return}
  await loadOrders();selected=id;await openOrder(id);
}
async function finishOrder(id){
  const o=allOrders.find(x=>x.id===id);
  if(!o?.result_a_path||!o?.result_b_path){alert("请先回填方向 A 和方向 B 两张效果图。");return}
  const {error}=await sb.from("orders").update({process_status:"completed",status:"completed",updated_at:new Date().toISOString()}).eq("id",id);
  if(error){alert("更新失败："+error.message);return}
  await loadOrders();selected=id;await openOrder(id);
}
function copyPrompt(){const t=document.getElementById("p");navigator.clipboard.writeText(t.value).then(()=>alert("提示词已复制"))}

document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));t.classList.add("on");filter=t.dataset.f;renderList()});
init();
</script>
</body>
</html>
