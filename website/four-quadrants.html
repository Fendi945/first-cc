<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>要事第一 · 元演心智</title>
<meta name="description" content="四象限法则任务管理——重要紧急矩阵。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=Caveat:wght@400;600;700&family=Inter:wght@300;400;600;800;900&family=Noto+Serif+SC:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
/* =============================================
   元演心智 · Esther版设计系统
   ============================================= */
:root {
  --bg:           #fefcf6;
  --surface:      #ffffff;
  --surface-hover:#f8f6f0;
  --surface-alt:  #f5f2ea;
  --text:         #1a1a1a;
  --text-secondary:#555555;
  --text-muted:   #999999;
  --text-dim:     #bbbbbb;

  --esther-yellow: #F4D758;
  --esther-blue:   #2B7FD8;
  --esther-orange: #F7A946;
  --esther-dark:   #1a2332;

  --accent:       #F4D758;
  --accent-hover: #e8c840;
  --accent-subtle:rgba(244,215,88,0.12);
  --accent-glow:  rgba(244,215,88,0.15);
  --primary:      #2B7FD8;
  --primary-subtle:rgba(43,127,216,0.10);

  /* Quadrant colors */
  --q1-color:     #d4522a;
  --q1-bg:        rgba(212,82,42,0.08);
  --q1-border:    rgba(212,82,42,0.15);
  --q1-glow:      rgba(212,82,42,0.12);

  --q2-color:     #2B7FD8;
  --q2-bg:        rgba(43,127,216,0.08);
  --q2-border:    rgba(43,127,216,0.15);
  --q2-glow:      rgba(43,127,216,0.12);

  --q3-color:     #F7A946;
  --q3-bg:        rgba(247,169,70,0.08);
  --q3-border:    rgba(247,169,70,0.15);
  --q3-glow:      rgba(247,169,70,0.12);

  --q4-color:     #8a8a8a;
  --q4-bg:        rgba(138,138,138,0.06);
  --q4-border:    rgba(138,138,138,0.12);
  --q4-glow:      rgba(138,138,138,0.08);

  --border:       rgba(0,0,0,0.06);
  --border-card:  rgba(0,0,0,0.06);

  --font-sans:    'Noto Sans SC', 'Inter', -apple-system, sans-serif;
  --font-serif:   'Noto Serif SC', 'Source Han Serif SC', serif;
  --font-cursive: 'Caveat', cursive;

  --radius-card:  20px;
  --radius-sm:    12px;
  --radius-pill:  100px;

  --ease:         .4s cubic-bezier(.16,1,.3,1);
  --ease-quick:   .3s ease;
}

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;font-size:16px}
body{
  font-family:var(--font-sans);
  background:var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  line-height:1.8;
  overflow-x:hidden;
  min-height:100vh;
}
::selection{background:var(--accent);color:var(--esther-dark)}

/* === Nav === */
nav{
  display:flex;justify-content:center;gap:40px;
  padding:20px 24px;
  background:rgba(254,252,246,0.85);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  position:sticky;top:0;z-index:100;
  border-bottom:1px solid rgba(0,0,0,0.04);
}
nav a{
  color:var(--text-secondary);font-size:13px;font-weight:500;
  text-decoration:none;letter-spacing:0.06em;
  transition:color var(--ease-quick);position:relative;
}
nav a::after{
  content:'';position:absolute;bottom:-4px;left:0;right:0;
  height:2px;background:var(--accent);
  transform:scaleX(0);transition:transform var(--ease-quick);
}
nav a:hover{color:var(--text)}
nav a:hover::after{transform:scaleX(1)}
nav a.active{color:var(--text)}
nav a.active::after{transform:scaleX(1)}

.nav-dropdown{position:relative;display:inline-flex;align-items:center}
.nav-dropdown>a{cursor:pointer}
.nav-dropdown>a::after{content:'';position:absolute;bottom:-4px;left:0;right:0;height:2px;background:var(--accent);transform:scaleX(0);transition:transform var(--ease-quick)}
.nav-dropdown:hover>a::after{transform:scaleX(1)}
.nav-dropdown:hover>a{color:var(--text)}
.nav-dropdown-menu{display:none;position:absolute;top:100%;left:50%;transform:translateX(-50%);padding-top:12px;background:transparent;z-index:200}
.nav-dropdown-menu-inner{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:6px;min-width:120px;box-shadow:0 8px 30px rgba(0,0,0,0.08)}
.nav-dropdown:hover .nav-dropdown-menu{display:block}
.nav-dropdown-menu-inner a{display:block;padding:8px 16px;border-radius:8px;font-size:13px;color:var(--text-secondary);text-decoration:none;transition:all var(--ease-quick);white-space:nowrap}
.nav-dropdown-menu-inner a:hover{background:var(--accent-subtle);color:var(--esther-dark)}
.nav-dropdown-menu-inner a::after{display:none}

/* === Banner === */
.banner{
  padding:80px 0 16px;text-align:center;
  background:var(--bg);
}
.banner h1{
  font-family:var(--font-serif);
  font-size:clamp(1.8rem,4vw,2.8rem);
  font-weight:800;
  letter-spacing:-0.02em;
  color:var(--text);
  line-height:1.15;
  margin-bottom:4px;
}
.banner h1::before{content:'\25CF';color:var(--accent);margin-right:10px;font-size:.7em;vertical-align:middle}
.banner p{
  font-size:15px;color:var(--text-secondary);
  max-width:460px;margin:0 auto;
  line-height:1.7;
}
.banner .back{
  display:inline-block;font-size:13px;color:var(--text-muted);
  text-decoration:none;transition:color var(--ease-quick);
  letter-spacing:0.04em;margin-bottom:8px;
}
.banner .back:hover{color:var(--esther-blue)}

/* === Container === */
.quadrant-wrap{
  max-width:1100px;margin:0 auto;
  padding:20px 20px 60px;
}

/* Toolbar */
.toolbar{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:20px;padding:0 4px;
}
.toolbar .date{
  font-size:.8125rem;color:var(--text-muted);font-variant-numeric:tabular-nums;
}
.toolbar .actions{display:flex;gap:8px}
.toolbar .actions button{
  padding:6px 14px;border:1px solid var(--border);border-radius:8px;
  background:var(--surface);color:var(--text-secondary);font-size:12px;
  cursor:pointer;font-family:inherit;transition:all var(--ease-quick);
}
.toolbar .actions button:hover{border-color:var(--accent);color:var(--text);background:var(--accent-subtle)}

/* === Quadrant Grid === */
.quadrant-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}

/* Quadrant */
.quadrant{
  background:var(--surface);
  border:1px solid var(--border-card);
  border-radius:var(--radius-card);
  display:flex;flex-direction:column;
  overflow:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,0.02);
  transition:box-shadow var(--ease),transform var(--ease-quick);
  min-height:280px;
}
.quadrant:hover{box-shadow:0 6px 24px rgba(0,0,0,0.04)}
.quadrant.drag-over{border-color:var(--esther-yellow)!important;box-shadow:0 0 0 3px rgba(244,215,88,0.2)!important}

.q1{border-top:3px solid var(--q1-color)}
.q2{border-top:3px solid var(--q2-color)}
.q3{border-top:3px solid var(--q3-color)}
.q4{border-top:3px solid var(--q4-color)}

.q1 .quadrant-head{background:var(--q1-bg);border-bottom:1px solid var(--q1-border)}
.q2 .quadrant-head{background:var(--q2-bg);border-bottom:1px solid var(--q2-border)}
.q3 .quadrant-head{background:var(--q3-bg);border-bottom:1px solid var(--q3-border)}
.q4 .quadrant-head{background:var(--q4-bg);border-bottom:1px solid var(--q4-border)}

.quadrant-head{
  padding:14px 18px;display:flex;align-items:center;gap:8px;flex-shrink:0;
}
.quadrant-head .icon{font-size:18px}
.quadrant-head h3{font-size:14px;font-weight:600;flex:1}
.q1 .quadrant-head h3{color:var(--q1-color)}
.q2 .quadrant-head h3{color:var(--q2-color)}
.q3 .quadrant-head h3{color:var(--q3-color)}
.q4 .quadrant-head h3{color:var(--q4-color)}

.quadrant-head .badge{
  font-size:10px;padding:2px 10px;border-radius:10px;font-weight:600;letter-spacing:.3px;
}
.q1 .badge{background:var(--q1-bg);color:var(--q1-color)}
.q2 .badge{background:var(--q2-bg);color:var(--q2-color)}
.q3 .badge{background:var(--q3-bg);color:var(--q3-color)}
.q4 .badge{background:var(--q4-bg);color:var(--q4-color)}

.quadrant-sub{
  font-size:11px;color:var(--text-dim);
  padding:4px 18px 8px;border-bottom:1px solid var(--border);
}

.quadrant-head .count{
  font-size:12px;font-weight:700;
  background:var(--surface);padding:1px 8px;border-radius:8px;
  min-width:22px;text-align:center;
}
.q1 .count{color:var(--q1-color)}
.q2 .count{color:var(--q2-color)}
.q3 .count{color:var(--q3-color)}
.q4 .count{color:var(--q4-color)}

/* Task list */
.task-list{
  flex:1;overflow-y:auto;padding:4px 8px;
  min-height:120px;
}
.task-list::-webkit-scrollbar{width:4px}
.task-list::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.08);border-radius:2px}

/* Task item */
.task-item{
  display:flex;align-items:center;gap:8px;
  padding:8px 10px;margin:2px 0;
  border-radius:var(--radius-sm);
  background:var(--surface);
  border:1px solid var(--border);
  transition:all .2s;cursor:grab;
  animation:taskIn .25s ease;
}
@keyframes taskIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}

.q1 .task-item:hover{background:var(--q1-bg);border-color:var(--q1-border)}
.q2 .task-item:hover{background:var(--q2-bg);border-color:var(--q2-border)}
.q3 .task-item:hover{background:var(--q3-bg);border-color:var(--q3-border)}
.q4 .task-item:hover{background:var(--q4-bg);border-color:var(--q4-border)}

.task-item.done{opacity:.6;background:rgba(0,0,0,0.02)!important;border-color:transparent!important}
.task-item:active{cursor:grabbing}

.task-check{
  width:20px;height:20px;border-radius:50%;
  border:2px solid rgba(0,0,0,0.12);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex-shrink:0;
  transition:all .25s;font-size:10px;color:transparent;
  background:transparent;
}
.task-check:hover{border-color:var(--esther-yellow)}
.task-check.done{
  border-color:var(--q2-color);background:var(--q2-color);color:#fff;
  box-shadow:0 0 8px rgba(43,127,216,0.2);
}

.task-text{
  flex:1;font-size:13px;line-height:1.4;word-break:break-word;
  cursor:pointer;padding:1px 4px;border-radius:4px;
  transition:background .15s;
}
.task-text.done{text-decoration:line-through;opacity:.6}
.task-text:hover{background:rgba(0,0,0,0.03)}
.task-text:focus{outline:none;background:var(--accent-subtle)}

.task-time{
  font-size:10px;color:var(--text-dim);
  padding:2px 6px;border-radius:4px;
  background:rgba(0,0,0,0.03);white-space:nowrap;
  display:flex;align-items:center;gap:2px;flex-shrink:0;
}
.task-time.overdue{color:var(--q1-color);background:var(--q1-bg)}
.task-time.today{color:var(--q2-color);background:var(--q2-bg)}

.task-actions{
  display:flex;gap:2px;opacity:0;transition:opacity .2s;
}
.task-item:hover .task-actions{opacity:1}
.task-act{
  width:24px;height:24px;border:none;background:transparent;
  cursor:pointer;border-radius:4px;font-size:12px;
  display:flex;align-items:center;justify-content:center;
  transition:all .2s;color:var(--text-dim);
}
.task-act:hover{background:rgba(0,0,0,0.04);color:var(--text)}
.task-act.del:hover{background:var(--q1-bg);color:var(--q1-color)}

/* Input area */
.add-area{padding:8px 12px 10px;border-top:1px solid var(--border);flex-shrink:0}
.input-row{display:flex;gap:6px;align-items:center}
.input-row input{
  flex:1;padding:8px 10px;border:1.5px solid var(--border);
  border-radius:8px;font-size:13px;outline:none;
  transition:all .25s;font-family:inherit;background:var(--surface-hover);
  color:var(--text);
}
.q1 .input-row input:focus{border-color:var(--q1-color);box-shadow:0 0 0 3px var(--q1-glow)}
.q2 .input-row input:focus{border-color:var(--q2-color);box-shadow:0 0 0 3px var(--q2-glow)}
.q3 .input-row input:focus{border-color:var(--q3-color);box-shadow:0 0 0 3px var(--q3-glow)}
.q4 .input-row input:focus{border-color:var(--q4-color);box-shadow:0 0 0 3px var(--q4-glow)}
.input-row input::placeholder{color:var(--text-dim)}
.time-btn{
  width:34px;height:34px;border:1.5px solid var(--border);
  border-radius:8px;background:var(--surface-hover);
  cursor:pointer;font-size:16px;
  display:flex;align-items:center;justify-content:center;
  transition:all .2s;flex-shrink:0;line-height:1;
}
.time-btn:hover{border-color:var(--esther-yellow)}
.time-btn.active{background:var(--accent-subtle);border-color:var(--esther-yellow)}

.time-picker{
  display:none;gap:6px;align-items:center;
  margin-top:6px;padding:6px 8px;
  background:var(--surface-hover);border-radius:8px;
  border:1px solid var(--border);animation:taskIn .2s ease;
}
.time-picker.show{display:flex}
.time-picker input{
  padding:4px 8px;border:1px solid var(--border);border-radius:6px;
  font-size:11px;outline:none;font-family:inherit;
  background:var(--surface);color:var(--text);flex:1;min-width:0;
}
.time-picker input:focus{border-color:var(--esther-yellow)}
.time-picker .clear{
  padding:4px 8px;border:1px solid var(--border);border-radius:6px;
  background:transparent;cursor:pointer;font-size:10px;
  color:var(--text-dim);transition:all .2s;
}
.time-picker .clear:hover{border-color:var(--q1-color);color:var(--q1-color)}

.empty-hint{
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;height:100%;color:var(--text-dim);
  font-size:12px;gap:2px;padding:20px;
}

/* === Modal === */
.modal-overlay{
  display:none;position:fixed;top:0;left:0;right:0;bottom:0;
  background:rgba(0,0,0,0.3);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  z-index:1000;justify-content:center;align-items:center;
}
.modal-overlay.active{display:flex}
.modal{
  background:var(--surface);border-radius:var(--radius-card);
  border:1px solid var(--border-card);
  box-shadow:0 20px 60px rgba(0,0,0,0.1);
  width:460px;max-width:90vw;max-height:80vh;overflow-y:auto;
  animation:modalIn .35s ease;
}
@keyframes modalIn{from{transform:scale(.95) translateY(12px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
.modal-head{
  padding:18px 22px;border-bottom:1px solid var(--border);
  display:flex;justify-content:space-between;align-items:center;
}
.modal-head h2{font-size:16px;font-weight:600}
.modal-close{font-size:22px;cursor:pointer;color:var(--text-dim);transition:color .2s;background:none;border:none;font-family:inherit}
.modal-close:hover{color:var(--text)}
.modal-body{padding:20px 22px;line-height:1.8;color:var(--text-secondary);font-size:14px}
.modal-body li{padding:8px 12px;margin-bottom:6px;background:var(--surface-hover);border-radius:8px;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--text)}
.modal-body .quote{margin-top:16px;font-style:italic;color:var(--text-muted);border-left:3px solid var(--accent);padding:10px 14px;background:var(--accent-subtle);border-radius:0 8px 8px 0;font-size:13px}
.modal-foot{padding:14px 22px;border-top:1px solid var(--border);text-align:right}
.modal-foot button{
  padding:8px 20px;background:var(--accent);border:none;border-radius:8px;
  color:var(--esther-dark);font-weight:600;font-size:13px;cursor:pointer;
  font-family:inherit;transition:all var(--ease-quick);
}
.modal-foot button:hover{background:var(--accent-hover)}

/* === Footer === */
footer{
  background:var(--esther-dark);color:#fff;
  text-align:center;padding:50px 24px;
}
footer .social{
  display:flex;justify-content:center;gap:28px;margin-bottom:20px;
}
footer .social a{
  color:rgba(255,255,255,0.6);font-size:14px;
  text-decoration:none;transition:all var(--ease-quick);padding-bottom:4px;
}
footer .social a:hover{color:var(--accent)}
footer p{
  color:rgba(255,255,255,0.35);font-size:13px;
  letter-spacing:0.04em;line-height:1.8;
}
footer .signature{
  margin-top:16px;font-family:var(--font-cursive);
  font-size:14px;color:rgba(255,255,255,0.25);
  transition:color var(--ease-quick);
}
footer .signature:hover{color:var(--accent)}

/* === Responsive === */
@media(max-width:768px){
  nav{gap:16px;padding:16px 12px;flex-wrap:wrap}
  nav a{font-size:11px;letter-spacing:0.04em}
  .banner{padding:60px 0 12px}
  .quadrant-wrap{padding:12px 12px 40px}
  .quadrant-grid{grid-template-columns:1fr;gap:12px}
  .quadrant{min-height:220px}
}
@media(max-width:480px){
  .toolbar{flex-direction:column;gap:8px;align-items:stretch}
  .toolbar .actions{justify-content:center}
  .time-picker{flex-wrap:wrap}
}
</style>
</head>

        <span class="badge">委托他人</span>
        <span class="count" id="cnt3">0</span>
      </div>
      <div class="quadrant-sub">干扰 · 琐事 · 部分邮件</div>
      <div class="task-list" id="list3"></div>
      <div class="add-area">
        <div class="input-row">
          <input type="text" class="task-input" placeholder="+ 添加任务..." data-q="q3">
          <button class="time-btn" data-q="q3">⏰</button>
        </div>
        <div class="time-picker" id="tp3">
          <input type="date" class="tp-date">
          <input type="time" class="tp-time" value="12:00">
          <button class="clear" onclick="clearTP('q3')">清除</button>
        </div>
      </div>
    </div>

    <div class="quadrant q4" data-q="q4">
      <div class="quadrant-head">
        <span class="icon">⚪</span>
        <h3>不重要 &amp; 不紧急</h3>
        <span class="badge">尽量不做</span>
        <span class="count" id="cnt4">0</span>
      </div>
      <div class="quadrant-sub">娱乐 · 消遣 · 浪费时间</div>
      <div class="task-list" id="list4"></div>
      <div class="add-area">
        <div class="input-row">
          <input type="text" class="task-input" placeholder="+ 添加任务..." data-q="q4">
          <button class="time-btn" data-q="q4">⏰</button>
        </div>
        <div class="time-picker" id="tp4">
          <input type="date" class="tp-date">
          <input type="time" class="tp-time" value="12:00">
          <button class="clear" onclick="clearTP('q4')">清除</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-head">
      <h2>📅 今日计划</h2>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot">
      <button onclick="closeModal()">知道了 ✅</button>
    </div>
  </div>
</div>

<!-- Footer -->
<footer>
  <div class="social">
    <a href="https://github.com/Fendi945" target="_blank">GitHub</a>
    <a href="mailto:hello@yuanyan.cc">邮件</a>
  </div>
  <p>元演心智 · 持续进化中</p>
  <p style="margin-top:4px;">Built with &hearts; by Fendi + Claude</p>
  <p class="signature">慢慢走，欣赏啊</p>
</footer>

<script>
(function() {
  'use strict';

  const QS = ['q1','q2','q3','q4'];
  const STORAGE_KEY = 'four_quadrants_v2';

  const QUAD_META = {
    q1: { icon:'🔴', label:'重要紧急', badge:'立即去做' },
    q2: { icon:'🟢', label:'重要不紧急', badge:'制定计划' },
    q3: { icon:'🔵', label:'不重要紧急', badge:'委托他人' },
    q4: { icon:'⚪', label:'不重要不紧急', badge:'尽量不做' },
  };

  const DEFAULT_TASKS = (() => {
    const now = new Date();
    const today = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
    return {
      q1: [
        { id: 1, text:'项目截止任务', done:false, remind:true, plannedTime:`${today}T15:00:00` },
        { id: 2, text:'处理紧急故障', done:false, remind:true, plannedTime:`${today}T10:00:00` },
      ],
      q2: [
        { id: 3, text:'每天学习30分钟', done:false, remind:true, plannedTime:`${today}T09:00:00` },
        { id: 4, text:'制定下周计划', done:false, remind:true, plannedTime:`${today}T14:00:00` },
      ],
      q3: [
        { id: 5, text:'回复非紧急邮件', done:false, remind:false, plannedTime:null },
      ],
      q4: [
        { id: 6, text:'刷社交媒体', done:false, remind:false, plannedTime:null },
      ],
    };
  })();

  let data = {};
  let dragItem = null;

  // ── Storage ──

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) { data = JSON.parse(raw); return; }
    } catch(_) {}
    data = JSON.parse(JSON.stringify(DEFAULT_TASKS));
    save();
  }

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }

  // ── Helpers ──

  function todayStr() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }

  function esc(s) { const e=document.createElement('div'); e.textContent=s; return e.innerHTML; }

  function genId() { return Date.now() + Math.random(); }

  function fmtTime(iso) {
    if (!iso) return null;
    const d = new Date(iso);
    if (isNaN(d.getTime())) return null;
    const now = new Date();
    const taskDay = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const h = String(d.getHours()).padStart(2,'0');
    const m = String(d.getMinutes()).padStart(2,'0');
    if (taskDay === todayStr()) return { label:`今天 ${h}:${m}`, overdue:d<now, isToday:true };
    const tom = new Date(now); tom.setDate(tom.getDate()+1);
    const tomDay = `${tom.getFullYear()}-${String(tom.getMonth()+1).padStart(2,'0')}-${String(tom.getDate()).padStart(2,'0')}`;
    if (taskDay === tomDay) return { label:`明天 ${h}:${m}`, overdue:false, isToday:false };
    return { label:`${d.getMonth()+1}月${d.getDate()}日 ${h}:${m}`, overdue:d<now, isToday:false };
  }

  // ── Render ──

  function render() {
    QS.forEach(q => renderQuadrant(q));
    updateDate();
  }

  function renderQuadrant(q) {
    const list = document.getElementById('list'+q[1]);
    const tasks = data[q] || [];
    const sorted = [...tasks].sort((a,b) => {
      if (a.plannedTime && b.plannedTime) return new Date(a.plannedTime)-new Date(b.plannedTime);
      if (a.plannedTime) return -1; if (b.plannedTime) return 1; return 0;
    });

    list.innerHTML = '';
    if (!tasks.length) {
      list.innerHTML = '<div class="empty-hint"><span>📝 暂无任务</span><span style="font-size:10px;">在下方输入框添加</span></div>';
      return;
    }

    sorted.forEach(task => {
      const idx = tasks.findIndex(t => t.id === task.id);
      if (idx === -1) return;
      const el = document.createElement('div');
      el.className = 'task-item' + (task.done ? ' done' : '');
      el.draggable = true;
      el.dataset.idx = idx;

      const ti = fmtTime(task.plannedTime);
      let th = '';
      if (ti) { const c = ti.overdue ? 'overdue' : (ti.isToday ? 'today' : ''); th = `<span class="task-time ${c}">🕐 ${ti.label}</span>`; }

      el.innerHTML = `
        <div class="task-check${task.done?' done':''}" data-id="${task.id}">${task.done?'✓':''}</div>
        <span class="task-text${task.done?' done':''}" data-id="${task.id}">${esc(task.text)}</span>
        ${th}
        <span class="task-actions">
          <button class="task-act remind" data-id="${task.id}" title="${task.remind?'已开启提醒':'开启提醒'}">${task.remind?'🔔':'🔕'}</button>
          <button class="task-act del" data-id="${task.id}" title="删除">✕</button>
        </span>
      `;

      el.addEventListener('dragstart', e => {
        dragItem = { q, id: task.id };
        el.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
      });
      el.addEventListener('dragend', () => el.classList.remove('dragging'));

      list.appendChild(el);
    });
    updateCount(q);
  }

  function updateCount(q) {
    const cnt = (data[q]||[]).filter(t => !t.done).length;
    const el = document.getElementById('cnt'+q[1]);
    if (el) el.textContent = cnt;
  }

  function updateDate() {
    const d = new Date();
    const wd = ['日','一','二','三','四','五','六'];
    document.getElementById('dateDisplay').textContent = `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 星期${wd[d.getDay()]}`;
  }

  // ── Operations ──

  function addTask(q, text) {
    text = text.trim();
    if (!text) return;

    const dateEl = document.querySelector(`#tp${q[1]} .tp-date`);
    const timeEl = document.querySelector(`#tp${q[1]} .tp-time`);
    let plannedTime = null;
    if (dateEl && dateEl.value && timeEl && timeEl.value) {
      plannedTime = `${dateEl.value}T${timeEl.value}:00`;
    }

    const tasks = data[q] || [];
    tasks.unshift({ id: genId(), text, done:false, remind:(q==='q1'||q==='q2'), plannedTime });
    data[q] = tasks;
    save();
    renderQuadrant(q);
  }

  function toggleTask(q, id) {
    const tasks = data[q] || [];
    const task = tasks.find(t => t.id === id);
    if (!task) return;
    task.done = !task.done;
    save();
    renderQuadrant(q);

    if (task.done) {
      try {
        const msg = new SpeechSynthesisUtterance('Congratulations! Task completed!');
        msg.lang = 'en-US'; msg.rate = 0.9; msg.pitch = 0.7;
        speechSynthesis.cancel();
        speechSynthesis.speak(msg);
      } catch(_) {}
    }
  }

  function deleteTask(q, id) {
    data[q] = (data[q]||[]).filter(t => t.id !== id);
    save();
    renderQuadrant(q);
  }

  function toggleRemind(q, id) {
    const task = (data[q]||[]).find(t => t.id === id);
    if (task) { task.remind = !task.remind; save(); renderQuadrant(q); }
  }

  function editTask(q, id, newText) {
    newText = newText.trim();
    if (!newText) { renderQuadrant(q); return; }
    const task = (data[q]||[]).find(t => t.id === id);
    if (task) { task.text = newText; save(); }
  }

  function clearDone() {
    if (!confirm('确定清除所有已完成任务？')) return;
    QS.forEach(q => { data[q] = (data[q]||[]).filter(t => !t.done); });
    save(); render();
  }

  function resetTasks() {
    if (!confirm('重置为默认示例任务？')) return;
    data = JSON.parse(JSON.stringify(DEFAULT_TASKS));
    save(); render();
  }

  window.clearDone = clearDone;
  window.resetTasks = resetTasks;

  function clearTP(q) {
    const el = document.querySelector(`#tp${q[1]}`);
    if (el) { el.querySelector('.tp-date').value = ''; el.querySelector('.tp-time').value = '12:00'; }
  }
  window.clearTP = clearTP;

  // ── Modal ──

  function showDailyReminder() {
    const today = todayStr();
    const all = [];
    QS.forEach(q => {
      (data[q]||[]).forEach(t => {
        if (t.done) return;
        if (t.plannedTime && t.plannedTime.substring(0,10) === today) {
          all.push({...t, q});
        }
      });
    });

    let display = all;
    if (!display.length) {
      display = (data.q2||[]).filter(t => !t.done).map(t => ({...t, q:'q2'}));
    }
    if (!display.length) return;

    display.sort((a,b) => {
      if (a.plannedTime && b.plannedTime) return new Date(a.plannedTime)-new Date(b.plannedTime);
      if (a.plannedTime) return -1; if (b.plannedTime) return 1; return 0;
    });

    const qnames = { q1:'🔴 重要紧急', q2:'🟢 重要不紧急', q3:'🔵 不重要紧急', q4:'⚪ 不重要不紧急' };

    let html = `<p style="margin-bottom:14px;font-size:14px;">🌅 <strong>今天的任务计划</strong><span style="font-size:12px;color:var(--text-muted);margin-left:8px;">${today}</span></p><ul style="list-style:none;padding:0;">`;
    display.forEach(t => {
      const ts = t.plannedTime ? fmtTime(t.plannedTime) : null;
      const tt = ts ? `<span style="color:var(--esther-orange);font-weight:500;font-size:12px;">${ts.label}</span>` : '';
      html += `<li>${esc(t.text)} <span style="font-size:10px;color:var(--text-dim);margin-left:4px;">(${qnames[t.q]||''})</span> ${tt ? `<span>${tt}</span>` : ''}</li>`;
    });
    html += '</ul>';
    html += '<div class="quote">"关键不是把日程填满，而是把重要的事优先安排。"<br>— 史蒂芬·柯维</div>';

    document.getElementById('modalBody').innerHTML = html;
    document.getElementById('modalOverlay').classList.add('active');
  }

  window.closeModal = function() { document.getElementById('modalOverlay').classList.remove('active'); };

  // ── Events Setup ──

  function setup() {
    // Checkbox / remind / delete via delegation
    document.getElementById('quadrantGrid').addEventListener('click', e => {
      const check = e.target.closest('.task-check');
      if (check) { const id = Number(check.dataset.id); const q = findQ(id); if(q){toggleTask(q,id);} return; }

      const del = e.target.closest('.task-act.del');
      if (del) { const id = Number(del.dataset.id); const q = findQ(id); if(q){deleteTask(q,id);} return; }

      const remind = e.target.closest('.task-act.remind');
      if (remind) { const id = Number(remind.dataset.id); const q = findQ(id); if(q){toggleRemind(q,id);} return; }
    });

    // Inline edit on double-click / click on text
    document.getElementById('quadrantGrid').addEventListener('dblclick', e => {
      const txt = e.target.closest('.task-text');
      if (!txt || txt.classList.contains('done')) return;
      const id = Number(txt.dataset.id);
      const q = findQ(id);
      if (!q) return;
      const orig = txt.textContent;
      const input = document.createElement('input');
      input.type = 'text'; input.value = orig;
      input.style.cssText = 'flex:1;border:1.5px solid var(--accent);border-radius:6px;padding:4px 8px;font-size:13px;outline:none;font-family:inherit;background:var(--surface);color:var(--text);';
      txt.replaceWith(input);
      input.focus(); input.select();
      const finish = (save) => {
        const v = save ? input.value.trim() : orig;
        if (v && v !== orig) editTask(q, id, v);
        renderQuadrant(q);
      };
      input.addEventListener('blur', () => finish(true));
      input.addEventListener('keydown', e => {
        if (e.key==='Enter') { e.preventDefault(); input.blur(); }
        if (e.key==='Escape') { finish(false); }
      });
    });

    // Add task on Enter
    document.querySelectorAll('.task-input').forEach(inp => {
      inp.addEventListener('keydown', e => {
        if (e.key === 'Enter') {
          const q = inp.dataset.q;
          addTask(q, inp.value);
          inp.value = '';
          // collapse time picker
          const tp = document.getElementById('tp'+q[1]);
          if (tp) tp.classList.remove('show');
          const btn = document.querySelector(`.time-btn[data-q="${q}"]`);
          if (btn) btn.classList.remove('active');
        }
      });
    });

    // Time picker toggle
    document.querySelectorAll('.time-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const q = btn.dataset.q;
        const tp = document.getElementById('tp'+q[1]);
        const show = !tp.classList.contains('show');
        tp.classList.toggle('show', show);
        btn.classList.toggle('active', show);
        if (show) {
          const now = new Date();
          tp.querySelector('.tp-date').value = todayStr();
          const h = String(now.getHours()).padStart(2,'0');
          const m = String(now.getMinutes()+15).padStart(2,'0');
          tp.querySelector('.tp-time').value = `${h}:${m>59?'00':m}`;
        }
      });
    });

    // Drag & drop between quadrants
    document.querySelectorAll('.quadrant').forEach(qel => {
      qel.addEventListener('dragover', e => { e.preventDefault(); qel.classList.add('drag-over'); });
      qel.addEventListener('dragleave', () => qel.classList.remove('drag-over'));
      qel.addEventListener('drop', e => {
        e.preventDefault(); qel.classList.remove('drag-over');
        if (!dragItem) return;
        const targetQ = qel.dataset.q;
        if (dragItem.q === targetQ) { dragItem=null; return; }
        const tasks = data[dragItem.q] || [];
        const idx = tasks.findIndex(t => t.id === dragItem.id);
        if (idx === -1) { dragItem=null; return; }
        const task = tasks.splice(idx,1)[0];
        data[dragItem.q] = tasks;
        if (!data[targetQ]) data[targetQ] = [];
        if (targetQ==='q1'||targetQ==='q2') task.remind = true;
        data[targetQ].push(task);
        save();
        render();
        dragItem = null;
      });
    });

    // Keyboard shortcut i → focus first input
    document.addEventListener('keydown', e => {
      if (e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA') return;
      if (e.key==='i' && !e.ctrlKey && !e.metaKey) {
        e.preventDefault();
        const first = document.querySelector('.task-input');
        if (first) first.focus();
      }
      if (e.key==='Escape') closeModal();
    });

    // Show daily reminder after load
    setTimeout(showDailyReminder, 400);
  }

  function findQ(id) {
    for (const q of QS) {
      if ((data[q]||[]).some(t => t.id === id)) return q;
    }
    return null;
  }

  // ── Init ──
  load();
  render();
  setup();
})();
</script>
</body>
</html>
